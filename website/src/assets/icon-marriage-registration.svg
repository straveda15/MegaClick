<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="25.8 25.3 453.3 453.3" role="img" aria-label="Marriage registration certificate with wedding rings">
  <!-- back page -->
  <rect x="112" y="72" width="300" height="384" rx="34" fill="#D3DDEE"/>
  <!-- certificate -->
  <rect x="84" y="48" width="300" height="384" rx="34" fill="#F6F8FC"/>
  <!-- header band -->
  <path d="M84 82a34 34 0 0 1 34-34h232a34 34 0 0 1 34 34v70H84z" fill="#E94B6A"/>
  <path d="M84 126h300v26H84z" fill="#D63C5B"/>
  <!-- heart -->
  <path d="M234 128c-32-20-34-48-14-48 8 0 14 5 14 11 0-6 6-11 14-11 20 0 18 28-14 48z" fill="#FFFFFF"/>
  <!-- text lines -->
  <rect x="124" y="188" width="220" height="16" rx="8" fill="#B7C4DC"/>
  <rect x="124" y="222" width="176" height="16" rx="8" fill="#CBD5E6"/>
  <rect x="124" y="256" width="200" height="16" rx="8" fill="#CBD5E6"/>
  <!-- seal ribbon tails -->
  <path d="M132 372l-14 52 32-16 20 20 6-56z" fill="#FF8A1F"/>
  <!-- seal -->
  <circle cx="156" cy="352" r="44" fill="#FFB020"/>
  <circle cx="156" cy="352" r="30" fill="none" stroke="#FF8A1F" stroke-width="7"/>
  <path d="M156 336l5.2 10.6 11.6 1.7-8.4 8.2 2 11.6-10.4-5.5-10.4 5.5 2-11.6-8.4-8.2 11.6-1.7z" fill="#FF8A1F"/>
  <!-- rings -->
  <circle cx="292" cy="348" r="52" fill="none" stroke="#FFC83D" stroke-width="22"/>
  <circle cx="358" cy="348" r="52" fill="none" stroke="#FF9F1A" stroke-width="22"/>
  <!-- ring 1 passes over ring 2 at the top crossing -->
  <path d="M309.8 299.1A52 52 0 0 1 337 322" fill="none" stroke="#FFC83D" stroke-width="22" stroke-linecap="butt"/>
</svg>
