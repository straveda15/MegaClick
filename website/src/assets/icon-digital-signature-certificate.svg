<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="34.7 34.7 426.7 426.7" role="img" aria-label="Digital signature certificate with USB token">
  <!-- back page -->
  <rect x="100" y="80" width="280" height="360" rx="32" fill="#CFDFF4"/>
  <!-- certificate -->
  <rect x="72" y="56" width="280" height="360" rx="32" fill="#F5F9FE"/>
  <!-- header band -->
  <path d="M72 88a32 32 0 0 1 32-32h216a32 32 0 0 1 32 32v56H72z" fill="#2D6CDF"/>
  <rect x="112" y="86" width="120" height="16" rx="8" fill="#FFFFFF"/>
  <rect x="112" y="112" width="76" height="12" rx="6" fill="#9FC0F5"/>
  <!-- text lines -->
  <rect x="112" y="176" width="200" height="14" rx="7" fill="#B9C9E2"/>
  <rect x="112" y="204" width="160" height="14" rx="7" fill="#CFDAEC"/>
  <rect x="112" y="232" width="184" height="14" rx="7" fill="#CFDAEC"/>
  <!-- signature -->
  <path d="M112 350c18-46 30 6 48-22 12-18 22-16 28 4 6 20 20 16 30-6 8-16 22-12 28 6" fill="none" stroke="#2D6CDF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="112" y="368" width="190" height="8" rx="4" fill="#B9C9E2"/>
  <!-- USB connector -->
  <rect x="326" y="112" width="72" height="96" rx="12" fill="#A5B0C2"/>
  <rect x="338" y="124" width="48" height="64" rx="6" fill="#6B778C"/>
  <rect x="346" y="134" width="12" height="18" rx="2" fill="#A5B0C2"/>
  <rect x="366" y="134" width="12" height="18" rx="2" fill="#A5B0C2"/>
  <!-- token body -->
  <rect x="300" y="190" width="124" height="250" rx="28" fill="#5CD0FF"/>
  <path d="M384 190h12a28 28 0 0 1 28 28v194a28 28 0 0 1-28 28h-12z" fill="#28A8EA"/>
  <!-- shield -->
  <path d="M362 268l42 14v36c0 28-20 46-42 56-22-10-42-28-42-56v-36z" fill="#FFFFFF"/>
  <path d="M344 322l14 14 28-32" fill="none" stroke="#22B573" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- lanyard hole -->
  <circle cx="362" cy="408" r="9" fill="#28A8EA"/>
</svg>
